name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-musl:
    name: Build Linux musl
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/uart-proxy dist/uart-proxy
          tar -C dist -czf "uart-proxy-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz" uart-proxy
          sha256sum "uart-proxy-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz" > "uart-proxy-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz.sha256"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: |
            uart-proxy-*.tar.gz
            uart-proxy-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        shell: pwsh
        run: |
          $archive = "uart-proxy-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/release/uart-proxy.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            uart-proxy-*.zip
            uart-proxy-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - linux-musl
      - windows

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
