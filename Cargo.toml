[package]
name = "uart-proxy"
version = "0.1.0"
edition = "2024"
description = "Expose a serial port over TCP and recreate it as a Linux PTY"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/jprendes/uart-proxy"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-serial = { version = "5.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs", "inotify", "term"] }
